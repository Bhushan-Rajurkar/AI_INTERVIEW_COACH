<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | AI Interview Coach</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <a href="/" class="brand">
      <div class="brand-icon">⚡</div>
      <span>AI Coach Interview</span>
    </a>
    <div id="navbar-auth-section" class="nav-links">
      <a href="/login.html" class="btn btn-secondary">Log In</a>
    </div>
  </header>

  <!-- Reset Password Form -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Set New Password</h1>
        <p>Verify your Email JWT token and create a new password</p>
      </div>

      <div id="tokenStatusBadge" style="margin-bottom:1rem;display:none;padding:0.5rem 0.8rem;border-radius:6px;font-size:0.85rem;text-align:center;"></div>

      <form id="reset-form">
        <!-- JWT Token Input -->
        <div class="form-group">
          <label for="token">JWT Reset Token</label>
          <textarea id="token" class="form-input" style="font-size:0.8rem;font-family:monospace;height:70px;resize:none;" placeholder="Paste your JWT reset token here" required></textarea>
        </div>

        <!-- New Password -->
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" class="form-input" placeholder="At least 6 characters" minlength="6" required />
        </div>

        <!-- Confirm Password -->
        <div class="form-group">
          <label for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="Repeat your new password" minlength="6" required />
        </div>

        <button type="submit" id="resetBtn" class="btn btn-primary" style="width:100%;margin-top:1rem;padding:0.85rem;">
          Update Password
        </button>
      </form>

      <div style="text-align:center;margin-top:1.5rem;font-size:0.9rem;color:var(--text-secondary);">
        Need another reset token? <a href="/forgot-password.html" style="font-weight:600;">Request here</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const tokenInput = document.getElementById('token');
    const badge = document.getElementById('tokenStatusBadge');

    // Auto-fill token from URL if available
    const urlParams = new URLSearchParams(window.location.search);
    const tokenFromUrl = urlParams.get('token');
    if (tokenFromUrl) {
      tokenInput.value = tokenFromUrl;
      verifyToken(tokenFromUrl);
    }

    tokenInput.addEventListener('change', () => {
      const val = tokenInput.value.trim();
      if (val) verifyToken(val);
    });

    async function verifyToken(token) {
      try {
        const res = await fetch(`/api/auth/verify-reset-token?token=${encodeURIComponent(token)}`);
        const json = await res.json();
        badge.style.display = 'block';
        if (json.data === true) {
          badge.style.background = 'rgba(16, 185, 129, 0.2)';
          badge.style.color = '#34d399';
          badge.style.border = '1px solid #10b981';
          badge.innerText = '✓ Valid Password Reset Token';
        } else {
          badge.style.background = 'rgba(239, 68, 68, 0.2)';
          badge.style.color = '#f87171';
          badge.style.border = '1px solid #ef4444';
          badge.innerText = '✗ Invalid or Expired Token';
        }
      } catch (e) {
        badge.style.display = 'none';
      }
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const token = tokenInput.value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        showToast('Passwords do not match!', 'error');
        return;
      }

      const resetBtn = document.getElementById('resetBtn');
      resetBtn.disabled = true;
      resetBtn.innerText = 'Updating password...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });

        const result = await res.json();

        if (res.ok && result.success) {
          showToast('Password reset successfully! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = '/login.html?reset=success';
          }, 1200);
        } else {
          showToast(result.message || 'Failed to reset password', 'error');
          resetBtn.disabled = false;
          resetBtn.innerText = 'Update Password';
        }
      } catch (err) {
        showToast('Error: ' + err.message, 'error');
        resetBtn.disabled = false;
        resetBtn.innerText = 'Update Password';
      }
    });
  </script>
</body>
</html>
